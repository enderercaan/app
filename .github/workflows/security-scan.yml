name: Tailmance Security Scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-filesystem:
    name: Trivy repository security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          hide-progress: true
          skip-dirs: web/legal,web/localized,web/legal-country,web/legal-country-source,web/legal-locales,web/legal-source
