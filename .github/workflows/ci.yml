name: Tailmance CI
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The repository hygiene gate forbids node_modules inside the repository tree, so the checkout lives in
      # ./app and dependencies are installed one level above it (Node resolves them from the parent directory).
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Reproducible dependency install
        run: |
          cp app/package.json app/package-lock.json .
          cp -r app/vendor .
          npm ci --ignore-scripts
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Offline security, privacy, UX and domain checks
        working-directory: app
        run: npm run verify:offline
