name: Tailmance CI
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible dependency install
        run: npm ci --ignore-scripts
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Offline security, privacy, UX and domain checks
        run: npm run verify:offline
